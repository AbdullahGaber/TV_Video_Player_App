<!DOCTYPE html>
<html>
<head>
  <base href="/TV_Video_Player_App/">
  <script>
    // Universal dynamic base-href resolution:
    // Seamlessly supports GitHub Pages (/TV_Video_Player_App/), Vercel (/), Netlify, and localhost
    (function() {
      var base = document.querySelector('base');
      if (!base) {
        base = document.createElement('base');
        document.head.prepend(base);
      }
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        // If visiting without trailing slash on GitHub Pages, redirect with trailing slash
        if (!path.includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
          return;
        }
        var lastSlash = path.lastIndexOf('/');
        path = path.substring(0, lastSlash + 1);
      }
      base.setAttribute('href', path || '/');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StreamHub TV Video Player Web App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StreamHub TV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StreamHub TV</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #111114;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #native-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1E1E23 0%, #111114 100%);
      color: #ffffff;
      z-index: 999999;
      transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
    }
    #native-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-icon-container {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .loader-icon {
      width: 52px;
      height: 52px;
      fill: none;
      stroke: #E8344E;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 16px rgba(232, 52, 78, 0.7));
      animation: pulse-icon 2s ease-in-out infinite;
    }
    .spinner-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 88px;
      height: 88px;
      border: 3.5px solid rgba(232, 52, 78, 0.15);
      border-top-color: #E8344E;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
    }
    .loader-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin: 0 0 8px 0;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .loader-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.65);
      margin: 0;
      letter-spacing: 0.3px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 22px rgba(232, 52, 78, 0.95)); }
    }
  </style>
</head>
<body>
  <!-- Native Web Loader (Shown immediately on TV browser until Flutter initializes) -->
  <div id="native-loader">
    <div class="loader-icon-container">
      <div class="spinner-ring"></div>
      <svg class="loader-icon" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
        <polyline points="17 2 12 7 7 2"></polyline>
        <polygon points="10 11 15 14.5 10 18 10 11" fill="#E8344E"></polygon>
      </svg>
    </div>
    <h1 class="loader-title">StreamHub TV</h1>
    <p class="loader-subtitle">Loading television experience...</p>
  </div>

  <script>
    (function() {
      var loader = document.getElementById('native-loader');

      function hideLoader() {
        if (!loader || loader.classList.contains('fade-out')) return;
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }

      // Listen for Flutter's first frame event
      window.addEventListener('flutter-first-frame', hideLoader);

      // Observer for Flutter elements mounted into the DOM
      var observer = new MutationObserver(function(mutations, obs) {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
          setTimeout(hideLoader, 600);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Catch global JS errors and show them on the loader
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var subtitle = document.querySelector('.loader-subtitle');
        if (subtitle) {
          subtitle.textContent = 'Error: ' + msg;
          subtitle.style.color = '#ff6b6b';
        }
      });

      // Safety timeout to dismiss loader if Flutter takes long
      setTimeout(function() {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
          hideLoader();
        }
      }, 10000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
