  <script>
    // Universal dynamic base-href resolution:
    // Seamlessly supports GitHub Pages (/TV_Video_Player_App/), Vercel (/), Netlify, and localhost
    (function() {
      var base = document.querySelector('base');
      if (!base) {
        base = document.createElement('base');
        document.head.prepend(base);
      }
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        // If visiting without trailing slash on GitHub Pages, redirect with trailing slash so relative paths resolve cleanly
        if (!path.includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
          return;
        }
        var lastSlash = path.lastIndexOf('/');
        path = path.substring(0, lastSlash + 1);
      }
      base.setAttribute('href', path || '/');
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050608;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #native-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #141926 0%, #050608 100%);
      color: #ffffff;
      z-index: 999999;
      transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
    }
    #native-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-icon-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .loader-icon {
      width: 48px;
      height: 48px;
      fill: none;
      stroke: #2196F3;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px rgba(33, 150, 243, 0.6));
      animation: pulse-icon 2s ease-in-out infinite;
    }
    .spinner-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      border: 3px solid rgba(33, 150, 243, 0.15);
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
    }
    .loader-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .loader-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      margin: 0;
      letter-spacing: 0.3px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 18px rgba(33, 150, 243, 0.85)); }
    }

    /* Fallback HTML5 TV Player (For TV browsers lacking WebAssembly/WebGL) */
    #tv-fallback-player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 1000;

    .tv-progress-container {

    .tv-progress-fill {

    .tv-progress-bar.focused .tv-progress-fill {

    .tv-controls-bar {
      display: flex;
      align-items: center;

    .tv-btn {
      width: 58px;

    .tv-btn.focused {

    .tv-btn svg {

    }
    .hidden-overlay {
      opacity: 0;

    /* On-Screen Remote Action Toast */
    .tv-toast {
      position: absolute;
      top: 50%;

      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .tv-toast.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>

  <script>
    (function() {
      var loader = document.getElementById('native-loader');
      var fallbackContainer = document.getElementById('tv-fallback-player');
      var fallbackActive = false;

      function hideLoader() {
        if (!loader || loader.classList.contains('fade-out')) return;
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }

      // Feature detection: Check WebAssembly & WebGL
      var hasWasm = (function() {
        try {
          return typeof WebAssembly !== 'undefined' && typeof WebAssembly.instantiate === 'function';
        } catch(e) {
          return false;
        }
      })();

      var hasWebGL = (function() {
        try {
          var canvas = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      })();

      // -------------------------------------------------------------
      // Fallback HTML5 TV Video Player (Optimized for TV Remote D-Pad)
      // -------------------------------------------------------------
      var playlist = [
        { title: "Big Buck Bunny 1080 10s 5mb", file: "assets/assets/videos/Big_Buck_Bunny_1080_10s_5MB.mp4" },
        { title: "Sintel 1080 10s 2mb", file: "assets/assets/videos/Sintel_1080_10s_2MB.mp4" },
        { title: "Jellyfish 1080 10s 1mb", file: "assets/assets/videos/Jellyfish_1080_10s_1MB.mp4" }
      ];
      var currentIndex = 0;
      var videoEl = document.getElementById('tv-fallback-video');
      var overlayTop = document.getElementById('tv-overlay-top');
      var overlayBottom = document.getElementById('tv-overlay-bottom');
      var titleEl = document.getElementById('fallback-title');
      var counterEl = document.getElementById('fallback-counter');
      var timeCurrent = document.getElementById('fallback-time-current');
      var timeTotal = document.getElementById('fallback-time-total');
      var progressFill = document.getElementById('fallback-progress-fill');
      var progressBar = document.getElementById('fallback-progress-bar');
      var svgPlay = document.getElementById('svg-play');
      var svgPause = document.getElementById('svg-pause');
      var svgVolOn = document.getElementById('svg-volume-on');
      var svgVolOff = document.getElementById('svg-volume-off');
      var unmuteBtn = document.getElementById('fallback-unmute');
      var toastEl = document.getElementById('tv-toast');
      var hideControlsTimer = null;
      var toastTimer = null;

      // 6 Primary control buttons for D-Pad horizontal navigation
      var controlButtons = [
        { id: 'btn-prev', action: function() { window.tvPlayerPrev(); } },
        { id: 'btn-rewind', action: function() { window.tvPlayerRewind(); } },
        { id: 'btn-play', action: function() { window.tvPlayerTogglePlay(); } },
        { id: 'btn-forward', action: function() { window.tvPlayerForward(); } },
        { id: 'btn-next', action: function() { window.tvPlayerNext(); } },
        { id: 'btn-mute', action: function() { window.tvPlayerToggleMute(); } }
      ];
      var focusedIndex = 2; // Default focus on Play/Pause (center button)
      var focusZone = 'controls'; // 'controls', 'progress', or 'unmute'

      function showToast(message) {
        if (!toastEl) return;
        toastEl.innerHTML = message;
        toastEl.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          toastEl.classList.remove('visible');
        }, 1200);
      }

      function updateFocusUI() {
        // Remove focus from all
        for (var i = 0; i < controlButtons.length; i++) {
          var el = document.getElementById(controlButtons[i].id);
          if (el) el.classList.remove('focused');
        }
        if (progressBar) progressBar.classList.remove('focused');
        if (unmuteBtn) unmuteBtn.classList.remove('focused');

        if (focusZone === 'controls') {
          var current = document.getElementById(controlButtons[focusedIndex].id);
          if (current) current.classList.add('focused');
        } else if (focusZone === 'progress') {
          if (progressBar) progressBar.classList.add('focused');
        } else if (focusZone === 'unmute') {
          if (unmuteBtn) unmuteBtn.classList.add('focused');
        }
      }

      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "0:00";
        var m = Math.floor(seconds / 60);
        var s = Math.floor(seconds % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      function areControlsVisible() {
        return overlayBottom && !overlayBottom.classList.contains('hidden-overlay');
      }

      function showControls() {
        if (overlayTop) overlayTop.classList.remove('hidden-overlay');
        if (overlayBottom) overlayBottom.classList.remove('hidden-overlay');
        clearTimeout(hideControlsTimer);
        hideControlsTimer = setTimeout(function() {
          if (videoEl && !videoEl.paused) {
            if (overlayTop) overlayTop.classList.add('hidden-overlay');
            if (overlayBottom) overlayBottom.classList.add('hidden-overlay');
          }
        }, 5000);
        updateFocusUI();
      }

      function hideControls() {
        if (overlayTop) overlayTop.classList.add('hidden-overlay');
        if (overlayBottom) overlayBottom.classList.add('hidden-overlay');
        clearTimeout(hideControlsTimer);
      }

      function loadVideo(index) {
        if (index < 0) index = playlist.length - 1;
        if (index >= playlist.length) index = 0;
        currentIndex = index;

        var item = playlist[currentIndex];
        titleEl.textContent = item.title;
        counterEl.textContent = "Video " + (currentIndex + 1) + " of " + playlist.length;
        videoEl.src = item.file;
        videoEl.load();

        var playPromise = videoEl.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(err) {
            // Autoplay unmuted blocked -> mute and retry
            videoEl.muted = true;
            videoEl.play();
            if (unmuteBtn) unmuteBtn.style.display = 'block';
            if (svgVolOn) svgVolOn.style.display = 'none';
            if (svgVolOff) svgVolOff.style.display = 'block';
          });
        }
        showControls();
      }

      window.tvPlayerTogglePlay = function() {
        if (videoEl.paused) {
          videoEl.play();
          showToast('▶ Playing');
        } else {
          videoEl.pause();
          showToast('❚❚ Paused');
        }
        showControls();
      };

      window.tvPlayerNext = function() {
        loadVideo(currentIndex + 1);
        showToast('⏭ ' + playlist[currentIndex].title);
      };

      window.tvPlayerPrev = function() {
        loadVideo(currentIndex - 1);
        showToast('⏮ ' + playlist[currentIndex].title);
      };

      window.tvPlayerForward = function() {
        var target = Math.min(videoEl.duration || 0, videoEl.currentTime + 10);
        videoEl.currentTime = target;
        showToast('+10s ⏩');
        showControls();
      };

      window.tvPlayerRewind = function() {
        var target = Math.max(0, videoEl.currentTime - 10);
        videoEl.currentTime = target;
        showToast('⏪ -10s');
        showControls();
      };

      window.tvPlayerToggleMute = function() {
        videoEl.muted = !videoEl.muted;
        if (svgVolOn) svgVolOn.style.display = videoEl.muted ? 'none' : 'block';
        if (svgVolOff) svgVolOff.style.display = videoEl.muted ? 'block' : 'none';
        if (!videoEl.muted && unmuteBtn) unmuteBtn.style.display = 'none';
        showToast(videoEl.muted ? '🔇 Muted' : '🔊 Unmuted');
        showControls();
      };

      window.tvPlayerUnmute = function() {
        videoEl.muted = false;
        if (unmuteBtn) unmuteBtn.style.display = 'none';
        if (svgVolOn) svgVolOn.style.display = 'block';
        if (svgVolOff) svgVolOff.style.display = 'none';
        focusZone = 'controls';
        showToast('🔊 Unmuted');
        showControls();
      };

      window.tvPlayerSeek = function(event) {
        var rect = event.currentTarget.getBoundingClientRect();
        var pos = (event.clientX - rect.left) / rect.width;
        if (videoEl.duration) {
          videoEl.currentTime = pos * videoEl.duration;
        }
        showControls();
      };

      // Video element events
      videoEl.addEventListener('play', function() {
        if (svgPlay) svgPlay.style.display = 'none';
        if (svgPause) svgPause.style.display = 'block';
        showControls();
      });

      videoEl.addEventListener('pause', function() {
        if (svgPlay) svgPlay.style.display = 'block';
        if (svgPause) svgPause.style.display = 'none';
        showControls();
      });

      videoEl.addEventListener('timeupdate', function() {
        if (videoEl.duration) {
          var pct = (videoEl.currentTime / videoEl.duration) * 100;
          progressFill.style.width = pct + '%';
          timeCurrent.textContent = formatTime(videoEl.currentTime);
          timeTotal.textContent = formatTime(videoEl.duration);
        }
      });

      videoEl.addEventListener('ended', function() {
        // Continuous auto-loop to next video
        window.tvPlayerNext();
      });

      // -------------------------------------------------------------
      // Comprehensive TV Remote Control D-Pad & Key Navigation
      // -------------------------------------------------------------
      window.addEventListener('keydown', function(e) {
        if (!fallbackActive) return;

        // Auto-unmute on first user interaction if muted by browser autoplay policy
        if (videoEl && videoEl.muted && unmuteBtn && unmuteBtn.style.display === 'block') {
          window.tvPlayerUnmute();
        }

        var keyCode = e.keyCode || e.which;
        var key = e.key || '';

        // Check if controls are currently hidden
        var controlsVisible = areControlsVisible();

        // 1. D-PAD RIGHT (ArrowRight / KeyCode 39)
        if (keyCode === 39 || key === 'ArrowRight' || key === 'Right') {
          e.preventDefault();
          if (!controlsVisible) {
            showControls();
            return;
          }
          if (focusZone === 'progress') {
            window.tvPlayerForward();
          } else {
            focusZone = 'controls';
            focusedIndex = Math.min(controlButtons.length - 1, focusedIndex + 1);
          }
          showControls();
          return;
        }

        // 2. D-PAD LEFT (ArrowLeft / KeyCode 37)
        if (keyCode === 37 || key === 'ArrowLeft' || key === 'Left') {
          e.preventDefault();
          if (!controlsVisible) {
            showControls();
            return;
          }
          if (focusZone === 'progress') {
            window.tvPlayerRewind();
          } else {
            focusZone = 'controls';
            focusedIndex = Math.max(0, focusedIndex - 1);
          }
          showControls();
          return;
        }

        // 3. D-PAD UP (ArrowUp / KeyCode 38)
        if (keyCode === 38 || key === 'ArrowUp' || key === 'Up') {
          e.preventDefault();
          if (!controlsVisible) {
            showControls();
            return;
          }
          if (focusZone === 'controls') {
            focusZone = 'progress';
          } else if (focusZone === 'progress' && unmuteBtn && unmuteBtn.style.display !== 'none') {
            focusZone = 'unmute';
          }
          showControls();
          return;
        }

        // 4. D-PAD DOWN (ArrowDown / KeyCode 40)
        if (keyCode === 40 || key === 'ArrowDown' || key === 'Down') {
          e.preventDefault();
          if (!controlsVisible) {
            showControls();
            return;
          }
          if (focusZone === 'unmute') {
            focusZone = 'progress';
            showControls();
          } else if (focusZone === 'progress') {
            focusZone = 'controls';
            showControls();
          } else {
            // Down while on buttons -> hide controls immediately for clean watching
            hideControls();
          }
          return;
        }

        // 5. OK / ENTER / SELECT (KeyCode 13, 29443, 65385, 'Enter', 'Select', 'Ok')
        if (keyCode === 13 || keyCode === 29443 || keyCode === 65385 || key === 'Enter' || key === 'Select' || key === 'Ok' || key === 'OK') {
          e.preventDefault();
          if (!controlsVisible) {
            showControls();
            return;
          }
          if (focusZone === 'unmute') {
            window.tvPlayerUnmute();
          } else if (focusZone === 'progress') {
            window.tvPlayerTogglePlay();
          } else {
            // Trigger the currently focused button
            controlButtons[focusedIndex].action();
          }
          showControls();
          return;
        }

        // 6. DEDICATED TV REMOTE MEDIA KEYS (Direct Action from Anywhere)
        // Media Play / Pause / PlayPause
        if (keyCode === 179 || keyCode === 415 || keyCode === 19 || keyCode === 250 || keyCode === 463 || keyCode === 10252 || keyCode === 10251 || keyCode === 10250 ||
            key === 'MediaPlayPause' || key === 'MediaPlay' || key === 'MediaPause' || key === 'Play' || key === 'Pause' || keyCode === 32) {
          e.preventDefault();
          focusedIndex = 2; // Focus on play
          focusZone = 'controls';
          window.tvPlayerTogglePlay();
          return;
        }

        // Dedicated Fast Forward
        if (keyCode === 228 || keyCode === 417 || keyCode === 10233 || key === 'MediaFastForward' || key === 'FastForward') {
          e.preventDefault();
          focusedIndex = 3;
          focusZone = 'controls';
          window.tvPlayerForward();
          return;
        }

        // Dedicated Rewind
        if (keyCode === 227 || keyCode === 412 || keyCode === 10232 || key === 'MediaRewind' || key === 'Rewind') {
          e.preventDefault();
          focusedIndex = 1;
          focusZone = 'controls';
          window.tvPlayerRewind();
          return;
        }

        // Dedicated Track Next / PageDown
        if (keyCode === 176 || keyCode === 425 || keyCode === 10253 || keyCode === 34 || key === 'MediaTrackNext' || key === 'NextTrack') {
          e.preventDefault();
          focusedIndex = 4;
          focusZone = 'controls';
          window.tvPlayerNext();
          return;
        }

        // Dedicated Track Prev / PageUp
        if (keyCode === 177 || keyCode === 424 || keyCode === 10254 || keyCode === 33 || key === 'MediaTrackPrevious' || key === 'PreviousTrack') {
          e.preventDefault();
          focusedIndex = 0;
          focusZone = 'controls';
          window.tvPlayerPrev();
          return;
        }

        // Dedicated Mute
        if (keyCode === 77 || keyCode === 173 || keyCode === 449 || key === 'm' || key === 'M') {
          e.preventDefault();
          focusedIndex = 5;
          focusZone = 'controls';
          window.tvPlayerToggleMute();
          return;
        }

        // TV Back / Return Key (KeyCode 8, 27, 461, 10009)
        if (keyCode === 8 || keyCode === 27 || keyCode === 461 || keyCode === 10009 || key === 'Back' || key === 'Return' || key === 'Escape') {
          if (controlsVisible) {
            e.preventDefault();
            hideControls();
          }
          return;
        }
      });

      window.addEventListener('mousemove', showControls);
      window.addEventListener('touchstart', showControls);

      function activateHtml5TvPlayer() {
        if (fallbackActive) return;
        fallbackActive = true;
        hideLoader();
        if (fallbackContainer) {
          fallbackContainer.style.display = 'block';
        }
        loadVideo(0);
        showControls();
        updateFocusUI();
      }

      // Catch global JS/network errors
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebAssembly') !== -1 || msg.indexOf('canvaskit') !== -1) {
          console.warn('Wasm/CanvasKit load failure. Activating HTML5 TV player fallback.');
          activateHtml5TvPlayer();
          return;
        }
        var subtitle = document.querySelector('.loader-subtitle');
        if (subtitle && !fallbackActive) {
          subtitle.textContent = 'Error: ' + msg;
          subtitle.style.color = '#ff6b6b';
        }
      });

      // Listen for Flutter's first frame event
      window.addEventListener('flutter-first-frame', hideLoader);

      // Observer for Flutter elements mounted into the DOM
      var observer = new MutationObserver(function(mutations, obs) {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
          setTimeout(hideLoader, 600);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Initialization Strategy:
      if (hasWasm && hasWebGL) {
        // Modern browser -> Load Flutter Web
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        s.onerror = function() {
          console.warn('Failed to load flutter_bootstrap.js. Activating HTML5 TV player fallback.');
          activateHtml5TvPlayer();
        };
        document.body.appendChild(s);

        // Fallback safety timeout if Flutter engine fails to draw in 12s
        setTimeout(function() {
          if (!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
            console.warn('Flutter engine timeout. Activating HTML5 TV player fallback.');
            activateHtml5TvPlayer();
          }
        }, 12000);
      } else {
        // Smart TV browser without WebAssembly or WebGL -> Immediate smooth activation!
        console.log('WebAssembly not supported in this browser. Running TV HTML5 video player.');
        setTimeout(activateHtml5TvPlayer, 300);
      }
    })();
  </script>
