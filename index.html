<!DOCTYPE html>
<html>
<head>
  <base href="/TV_Video_Player_App/">
  <script>
    // Universal dynamic base-href resolution:
    // Seamlessly supports GitHub Pages (/TV_Video_Player_App/), Vercel (/), Netlify, and localhost
    (function() {
      var base = document.querySelector('base');
      if (!base) {
        base = document.createElement('base');
        document.head.prepend(base);
      }
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        // If visiting without trailing slash on GitHub Pages, redirect with trailing slash so relative paths resolve cleanly
        if (!path.includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
          return;
        }
        var lastSlash = path.lastIndexOf('/');
        path = path.substring(0, lastSlash + 1);
      }
      base.setAttribute('href', path || '/');
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TV Video Player Flutter Web Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TV Video Player">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TV Video Player</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050608;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #native-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #141926 0%, #050608 100%);
      color: #ffffff;
      z-index: 999999;
      transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
    }
    #native-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-icon-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .loader-icon {
      width: 48px;
      height: 48px;
      fill: none;
      stroke: #2196F3;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px rgba(33, 150, 243, 0.6));
      animation: pulse-icon 2s ease-in-out infinite;
    }
    .spinner-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      border: 3px solid rgba(33, 150, 243, 0.15);
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
    }
    .loader-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .loader-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      margin: 0;
      letter-spacing: 0.3px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 18px rgba(33, 150, 243, 0.85)); }
    }
  </style>
</head>
<body>
  <!-- Native Web Loader displayed instantly before Flutter scripts download & compile -->
  <div id="native-loader">
    <div class="loader-icon-container">
      <div class="spinner-ring"></div>
      <svg class="loader-icon" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="13" rx="2" ry="2"></rect>
        <polyline points="17 2 12 7 7 2"></polyline>
        <polygon points="10 11 15 13.5 10 16 10 11" fill="#2196F3" stroke="none"></polygon>
      </svg>
    </div>
    <h1 class="loader-title">TV Video Player</h1>
    <p class="loader-subtitle">Loading player engine...</p>
  </div>

  <script>
    (function() {
      var loader = document.getElementById('native-loader');
      function hideLoader() {
        if (!loader || loader.classList.contains('fade-out')) return;
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }

      // Catch global JS/network errors and display them instead of a blank screen
      window.addEventListener('error', function(event) {
        var subtitle = document.querySelector('.loader-subtitle');
        if (subtitle) {
          subtitle.textContent = 'Error: ' + (event.message || 'Script load failure');
          subtitle.style.color = '#ff6b6b';
        }
      });

      // 1. Listen for Flutter's first frame event
      window.addEventListener('flutter-first-frame', hideLoader);

      // 2. Observer for Flutter elements mounted into the DOM
      var observer = new MutationObserver(function(mutations, obs) {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
          setTimeout(hideLoader, 600);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 3. Fallback timeout
      setTimeout(hideLoader, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
